const ORDER = ['familiar','wendigo','blob','empusa','kobold','imp','banshee','narcissus','arachne','upir','lamia','behemoth','harpy','plutus','nightmare','fama','lemure','midas','aurevora','doppelgaenger','succubus','specunitas','astiwihad','erinyes','morpheus'];

const ROCKS = ['rockA','rockB','rockC'];

function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function sample(pts, lin) {
  const out = [], n = pts.length;
  if (n === 2 || lin) {
    for (let i = 0; i < n - 1; i++) { const [a, b] = [pts[i], pts[i + 1]]; const steps = Math.max(6, Math.round(Math.hypot(b[0]-a[0], b[1]-a[1]) / 4)); for (let k = 0; k < steps; k++) { const t = k / steps; out.push([a[0] + (b[0]-a[0]) * t, a[1] + (b[1]-a[1]) * t]); } }
    out.push(pts[n - 1]); return out;
  }
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(i-1,0)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(i+2,n-1)];
    const steps = Math.max(6, Math.round(Math.hypot(p2[0]-p1[0], p2[1]-p1[1]) / 4));
    for (let k = 0; k < steps; k++) {
      const t = k / steps, t2 = t*t, t3 = t2*t;
      const f = j => 0.5 * ((2*p1[j]) + (-p0[j]+p2[j])*t + (2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2 + (-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3);
      out.push([f(0), f(1)]);
    }
  }
  out.push(pts[n - 1]); return out;
}

function stroke(gs, R, key) {
  const h = React.createElement;
  if (gs.dot) { const [x, y, rx, ry] = gs.dot; return [h('ellipse', { key, cx: x, cy: y, rx, ry, fill: PAINT, opacity: 0.9 })]; }
  const { p, dry: dry0 = 0.3, splat = 0, lin } = gs;
  const w = gs.w * (gs.n ? 1 : 1.55), dry = Math.min(0.95, dry0 + 0.15);
  const c = sample(p, lin), m = c.length;
  const L = [0]; for (let i = 1; i < m; i++) L.push(L[i-1] + Math.hypot(c[i][0]-c[i-1][0], c[i][1]-c[i-1][1]));
  const total = L[m-1] || 1;
  const nrm = c.map((_, i) => { const a = c[Math.max(i-1,0)], b = c[Math.min(i+1,m-1)]; const dx = b[0]-a[0], dy = b[1]-a[1], l = Math.hypot(dx, dy) || 1; return [-dy/l, dx/l]; });
  const N = gs.n ?? Math.max(4, Math.min(48, Math.round(w / 1.3)));
  const out = [];
  for (let b = 0; b < N; b++) {
    const u = N === 1 ? 0 : (b / (N - 1)) * 2 - 1, e = Math.abs(u);
    const off = u * w / 2 + (R() - .5) * w * 0.12;
    const drift = (R() - .5) * w * 0.75;
    const t0 = R() * 0.06 + e * e * R() * 0.22;
    const t1 = 1 - (R() * 0.1 + e * R() * 0.32 + R() * dry * 0.35);
    let d = '';
    for (let i = 0; i < m; i++) {
      const t = L[i] / total; if (t < t0 || t > t1) continue;
      const o = off * (1 - 0.3 * t) + drift * t * t;
      d += (d ? 'L' : 'M') + (c[i][0] + nrm[i][0] * o).toFixed(1) + ' ' + (c[i][1] + nrm[i][1] * o).toFixed(1);
    }
    if (!d) continue;
    const props = { key: key + '-' + b, d, fill: 'none', stroke: PAINT, strokeWidth: (0.6 + R() * R() * 5 * (w > 25 ? 1.3 : 1)).toFixed(2), strokeLinecap: 'round', strokeLinejoin: 'round', opacity: (0.5 + R() * 0.5).toFixed(2) };
    if (R() < dry + e * 0.3) {
      const segs = []; let s = 0;
      while (s < 100) { const a = 8 + R() * 38, gp = 1 + R() * 9 * (dry + .2); segs.push(a.toFixed(1), gp.toFixed(1)); s += a + gp; }
      props.pathLength = 100; props.strokeDasharray = segs.join(' ');
    }
    out.push(h('path', props));
  }
  const end = c[m-1];
  for (let k = 0; k < splat; k++) {
    const a = R() * Math.PI * 2, r = w * 0.8 + R() * 30;
    out.push(h('circle', { key: key + '-s' + k, cx: end[0] + Math.cos(a) * r, cy: end[1] + Math.sin(a) * r, r: (0.8 + R() * 2.8).toFixed(1), fill: PAINT, opacity: 0.85 }));
  }
  return out;
}

let CACHE = null;
function buildArt() {
  if (CACHE) return CACHE;
  CACHE = PLATES.map(([id, name, gestures], pi) => {
    const kids = [];
    gestures.forEach((gs, gi) => kids.push(...stroke(gs, rng(pi * 997 + gi * 31 + 7), id + gi)));
    return { id, name, rock: ROCKS[pi % 3], art: React.createElement('g', null, kids) };
  });
  return CACHE;
}

class Component extends DCLogic {
  renderVals() {
    const all = buildArt();
    const inv = this.props.invocation ?? 'all';
    const gallery = !all.some(p => p.id === inv);
    return {
      plates: gallery ? all : all.filter(p => p.id === inv),
      gallery,
      captions: this.props.captions ?? true,
      cols: gallery ? 'repeat(auto-fill, minmax(240px, 1fr))' : 'minmax(0, 1fr)',
      maxW: gallery ? '1400px' : 'none',
      pad: gallery ? '48px 32px 80px' : '0',
    };
  }
}
